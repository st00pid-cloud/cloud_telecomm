spring.application.name=disastertelecom
spring.datasource.url=jdbc:h2:mem:disastertelecom;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Enable H2 web console (accessible at http://localhost:8080/h2-console)
spring.h2.console.enabled=true

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true


# Enable H2 Console & Hibernate DDL
spring.h2.console.path=/h2-console